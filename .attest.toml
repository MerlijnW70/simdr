# What this repository will let an agent write about itself.
#
# What is refused is an assertion nothing settles: a figure nobody measured, a path that is not
# there, a name the tree does not declare.

comments = "claims"
tolerance = 0.005
exempt = ["target/**", ".git/**"]

# The counters in README.md are NOT listed under strict_numbers, and deliberately. A stronger check
# already holds them: `every_marked_number_is_the_number_that_is_there` in `tests/documented.rs`
# asserts each `<!--count:-->` against the tree, which is a real count rather than a ledger entry.
# Listing them here would report them as unbacked while something better already guards them.
strict_numbers = []

[[benchmarks]]
name = "suite"
command = "cargo test --quiet --workspace"
scope = ["src", "runner/src", "tests"]
timeout = 1800

[[benchmarks]]
name = "latency"
command = "cargo run -p runner --release --example latency"
scope = ["runner/src", "src/lanes"]
timeout = 900

# The gate a passing suite cannot supply, delegated to the prober this repository already uses.
#
# The emitter's floor is seeded: `noha prober --update` over `src/` killed 301 of 301 viable
# mutants. It cannot be seeded in shards, which an earlier note here claimed -- `NOHA_ONLY` and
# `NOHA_SHARD` narrow a reading run, but with `--update` noha refuses them outright, since a
# shard's survivor set written as the floor launders every out-of-shard survivor out of it. The
# full run is minutes rather than the hours `max: 4000` suggests, because test-impact analysis
# picks the kill set per mutant.
#
# `proved` is still empty, and that is a separate step: a path here makes `attest check` refuse it
# until attest's own `prove` has a record of a clean probe *of that commit*. noha's baseline is not
# that record. Add paths as each earns one.
#
# That the file is here says nothing about any other checkout. This machine's global gitignore
# excludes `.noha/` from every repository on it, so neither the baseline nor the test-impact matrix
# beside it is in the tree, and `git check-ignore` names that global rule rather than `.gitignore`.
# `.gitignore` states the policy and the price it charges.
[mutation]
command = "noha prober --diff"
pattern = 'killed\s+(?P<killed>[0-9]+)/(?P<total>[0-9]+) viable\s+survivors\s+(?P<survivors>[0-9]+)'
required = 1.0
timeout = 3600
proved = []
