  # `runner/`, the pure half. Every file below contains no `unsafe` at all: it decides *what* to
  # emit and *what* the answer should be, and a wrong decision there is a wrong number rather than
  # a crashed process. The FFI half — buffer, device, and everything under dispatch/ — is
  # deliberately absent, and `tests/integrity.rs` holds that exclusion list so it cannot drift into
  # meaning "whatever nobody added yet".
