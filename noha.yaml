# noha.yaml — behavioral mutation-coverage config (generated by `noha init`).
# A tiny YAML subset: scalars, comments, and one level of `- ` lists.
# Inline comments: ` # ` (hash preceded by a space AND followed by a space or the end of
# the line) starts a comment; a `#` glued to text (`dir #1/file.py`) stays in the value.
stack: rust
root: .
baseline: .noha/baseline.tsv
max: 500
# `--workspace` on every one of these, and leaving it off was a silent hole.
#
# This is a root package with a member, so plain `cargo test` runs the root package *only*: six
# suites of nineteen. Every test in `runner/` — the whole execution and fuzzing layer — was outside
# the mutation gate, and so was every `src/` mutant that only a dispatch would catch. The score
# read 100% over the tests that happened to be in scope.
test: cargo test --workspace --quiet
guard: cargo clippy --workspace --all-targets -- -D warnings
build: cargo test --workspace --no-run --quiet
# On, because "no panics on any input" is a rule here rather than an aspiration: a bare
# `.unwrap()` in a production source is the one way this crate could abort a caller's process,
# and the clippy denials in lib.rs only catch the spellings clippy knows about.
fail_closed: true
# TIA (Test-Impact Analysis): `focus` is the single-test command template — `{test}` is
# replaced by the remembered killer test's name. Operator contract for `focus_kill_codes`:
# a listed exit code must mean "a test failed" and NOTHING else — never a usage error,
# a no-tests-collected exit, or any harness artifact. Only a listed code can certify a
# fast kill; every other exit falls back to the full kill set. When unsure, list nothing:
# you lose speed, never truth.
focus: cargo test --workspace --quiet {test}
focus_kill_codes: 101
# NOTE for whoever runs this: set `NOHA_JOBS=4` (or lower).
#
# The kill command runs the whole suite, and since `runner/`'s pure half joined the source list
# that suite dispatches on the GPU. Sixteen workers each driving the same device contend, some
# time out, and a timed-out probe is recorded as a *survivor* — so the score wanders between runs
# and names a different innocent line each time. Three separate "survivors" were chased down that
# way on 2026-08-12 and two of them were killed instantly when applied by hand.
#
# A survivor is only a finding if it reproduces. Apply it by hand before believing it.
# Hand-maintained, and therefore checked: `tests/integrity.rs` fails if this list and the `.rs`
# files under `src/` disagree in either direction. It had drifted to 33 of 38 — five files, one of
# them the phi and block-tracking code, never mutated while the score read 100%.
sources:
