name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  emitter:
    name: emitter — no device needed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: formatting
        run: cargo fmt --all --check

      - name: clippy
        env:
          RUSTFLAGS: -D warnings
        run: cargo clippy --workspace --all-targets

      - name: install spirv-tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools

      - name: emitter tests
        env:
          SPIRV_VAL: /usr/bin/spirv-val
        run: cargo test -p simdr -- --nocapture

      - name: integrity
        run: cargo test --test integrity -- --nocapture

      - name: documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  device:
    name: lavapipe — widths 4, 8 and 16
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - vector: 128
            width: 4
            skips: 27
          - vector: 256
            width: 8
            skips: 24
          - vector: 512
            width: 16
            skips: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: install lavapipe and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools spirv-tools

      - name: find the software driver
        run: |
          echo "ICDs installed:"
          ls -la /usr/share/vulkan/icd.d/ || true
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD found — the tests below would skip and pass over nothing"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "using $icd"

      - name: what the driver reports
        run: vulkaninfo --summary || true

      - name: which device
        run: cargo run -p simdr-cli -- list

      - name: runner tests at subgroup ${{ matrix.width }}
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
          SPIRV_VAL: /usr/bin/spirv-val
        run: |
          set -o pipefail
          cargo test -p runner -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/runner.log"
          skipped=$(grep -o 'SKIPPED ' "$RUNNER_TEMP/runner.log" | wc -l)
          echo "$skipped tests did not run at subgroup ${{ matrix.width }}, and ${{ matrix.skips }} is what this width is written not to run"
          if [ "$skipped" -ne "${{ matrix.skips }}" ]; then
            echo "::error::${{ matrix.width }}-wide run did not run $skipped tests and the matrix says ${{ matrix.skips }} — read the reasons above, then change the code or the number"
            exit 1
          fi

  msrv:
    name: the version Cargo.toml claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - run: cargo check --workspace --all-targets
