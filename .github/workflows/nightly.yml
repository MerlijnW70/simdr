name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      rounds:
        description: rounds per domain
        required: false
        default: "8000"

permissions:
  contents: read

jobs:
  sweep:
    name: lavapipe — a long sweep at ${{ matrix.width }} lanes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - vector: 128
            width: 4
          - vector: 512
            width: 16
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: install lavapipe and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools spirv-tools

      - name: find the software driver
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD found — the sweep would skip and pass over nothing"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: sweep at subgroup ${{ matrix.width }}
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
          SPIRV_VAL: /usr/bin/spirv-val
          SIMDR_FUZZ_ROUNDS: ${{ inputs.rounds || '8000' }}
        run: |
          set -o pipefail
          cargo test -p runner --release --test fuzzing -- --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/fuzz.log"

          domains=$(grep -o 'fuzz [A-Z][A-Za-z]* over ' "$RUNNER_TEMP/fuzz.log" | wc -l)
          echo "$domains domains swept at subgroup ${{ matrix.width }}"
          if [ "$domains" -ne 8 ]; then
            echo "::error::${{ matrix.width }}-wide sweep reported $domains domains and there are eight — a domain that is refused every round has no coverage and looks exactly like one that always agreed"
            exit 1
          fi

  liveness:
    name: every example still runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: install lavapipe and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 spirv-tools

      - name: find the software driver
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD found — every example would report no device and exit 0"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: run them
        env:
          SPIRV_VAL: /usr/bin/spirv-val
          LP_NATIVE_VECTOR_WIDTH: 256
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/examples.log"
          : > "$log"

          examples=$(find . -path ./target -prune -o -name '*.rs' -path '*/examples/*' -print)
          expected=$(echo "$examples" | wc -l)
          declining=3
          ran=0
          failed=""

          for path in $examples; do
            name=$(basename "$path" .rs)
            case "$path" in
              ./runner/*) crate="-p runner" ;;
              *)          crate="-p simdr" ;;
            esac

            case "$name" in
              emit_minimal) arguments="$RUNNER_TEMP/minimal.spv" ;;
              *)            arguments="" ;;
            esac

            echo "::group::$name"
            if timeout 240 cargo run $crate --release --example "$name" -- $arguments 2>&1 | tee -a "$log"; then
              ran=$((ran + 1))
            else
              failed="$failed $name(exit $?)"
            fi
            echo "::endgroup::"
          done

          skipped=$(grep -c '^SKIPPED ' "$log" || true)
          echo "$ran of $expected examples ran to a clean exit, $skipped of them by declining"

          if [ -n "$failed" ]; then
            echo "::error::these examples did not:$failed"
            exit 1
          fi
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::$ran ran and the tree holds $expected"
            exit 1
          fi
          if [ "$skipped" -ne "$declining" ]; then
            echo "::error::$skipped examples declined and this width is written for $declining — read the reasons above, then change the example or the number"
            exit 1
          fi
