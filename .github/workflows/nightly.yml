# A long differential sweep, on a schedule, because the short one is not the same check.
#
# Every push runs the fuzzer at 256 rounds per domain — enough to catch a broken generator and not
# enough to be a search. `notes/NEXT.md` calls the differential fuzzer the most valuable thing in
# this tree, and what makes it valuable is that nobody chose what it looks for: 30 000 generated
# programs found `reduce_min` folding its strips with a maximum, an `OpUDot` that had been invalid
# since the day it shipped, and a driver that faults compiling a valid module. None of those came
# from a benchmark and none of them came from 256 rounds.
#
# **The workload is throughput-shaped by construction** — thousands of independent questions with no
# caller waiting on any one of them — which is exactly the shape `decisions/DR-0008` says is worth
# running at all. So it runs overnight rather than in front of somebody.
#
# It is a *separate* workflow rather than a schedule on `ci.yml` on purpose: a nightly run of the
# whole matrix would say nothing new about formatting or the MSRV, and a failure here has to be
# readable as one thing rather than as one red mark among five.
#
# # And the examples, for the same reason
#
# `notes/CLAIMS.md` counts 378 measured numbers across these documents and observes that CI runs
# none of the programs that produced them: `cargo clippy --all-targets` **compiles** every example
# and runs none. So a `Gpu::open` that started refusing, a kernel that started erroring, a harness
# that stopped dispatching — none of it would be noticed by anything, while the numbers those
# programs printed went on being quoted.
#
# The check is **liveness, not the numbers**. A shared runner's wall clock is not evidence about
# throughput — `session.rs` skips its own speed ratio when `CI` is set, for exactly that reason — so
# this asks one question per program: does it still run to a clean exit. It is here rather than in
# `ci.yml` because seventeen programs on a software rasteriser is minutes rather than seconds, and
# nobody should wait for that on a push.

name: nightly

on:
  schedule:
    # 03:00 UTC. A time nobody is waiting on the answer.
    - cron: "0 3 * * *"
  # And on demand, because a run somebody cannot start is a run nobody trusts.
  workflow_dispatch:
    inputs:
      rounds:
        description: rounds per domain
        required: false
        default: "8000"

permissions:
  contents: read

jobs:
  sweep:
    name: lavapipe — a long sweep at ${{ matrix.width }} lanes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Four and sixteen: the two ends of what lavapipe can be pinned to, and the two widths that
        # have found things. Eight is skipped here because it is the default the push builds
        # already sweep, and this job is for the reach the short run does not have.
        include:
          - vector: 128
            width: 4
          - vector: 512
            width: 16
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: install lavapipe and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools spirv-tools

      # Discovered rather than assumed, and failing when it is not there. `common::device` skips
      # loudly when no device opens, so a missing driver would leave a sweep reporting green over
      # nothing — which is the one outcome a fuzzer must never be able to produce.
      - name: find the software driver
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD found — the sweep would skip and pass over nothing"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: sweep at subgroup ${{ matrix.width }}
        env:
          LP_NATIVE_VECTOR_WIDTH: ${{ matrix.vector }}
          SPIRV_VAL: /usr/bin/spirv-val
          SIMDR_FUZZ_ROUNDS: ${{ inputs.rounds || '8000' }}
        run: |
          set -o pipefail
          cargo test -p runner --release --test fuzzing -- --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/fuzz.log"

          # **The sweep has to have run.** Every domain prints one line saying how many rounds
          # agreed, and a run that produced none of them is a run that found nothing because it did
          # nothing. `SIMDR_FUZZ_ROUNDS` refusing to parse is already an error rather than a silent
          # default — this is the other half of the same guard, on the other side of the harness.
          #
          # **Occurrences rather than lines, and unanchored**, which is the same correction
          # `ci.yml` carries three files away and which this one had to make on its first run. With
          # `--nocapture`, `libtest` writes `test <name> ... ` and only finishes the line after the
          # body has run — so a domain's own output lands *mid-line* behind the name of the test it
          # belongs to. Anchored, this counted four of eight and failed a sweep in which all eight
          # had agreed. The guard's first catch was itself.
          domains=$(grep -o 'fuzz [A-Z][A-Za-z]* over ' "$RUNNER_TEMP/fuzz.log" | wc -l)
          echo "$domains domains swept at subgroup ${{ matrix.width }}"
          if [ "$domains" -ne 8 ]; then
            echo "::error::${{ matrix.width }}-wide sweep reported $domains domains and there are eight — a domain that is refused every round has no coverage and looks exactly like one that always agreed"
            exit 1
          fi

  liveness:
    name: every example still runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: install lavapipe and spirv-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 spirv-tools

      # Without a driver every example reports no device and exits **zero**, which is the shape of
      # green this whole workflow exists to refuse.
      - name: find the software driver
        run: |
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n1)
          if [ -z "$icd" ]; then
            echo "::error::no lavapipe ICD found — every example would report no device and exit 0"
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      # **Discovered and counted, not listed.** A loop that finds no examples exits zero and prints
      # nothing, so the number found is compared against the number the tree holds — the same shape
      # `tests/documented.rs` uses for the same reason.
      #
      # `--release`, because several of these measure something and a debug build of a sweep over a
      # million elements on a software rasteriser is not a wait anybody needs. And a timeout per
      # program, because one that hangs must fail rather than take the job's hour with it.
      - name: run them
        env:
          SPIRV_VAL: /usr/bin/spirv-val
        run: |
          examples=$(find . -path ./target -prune -o -name '*.rs' -path '*/examples/*' -print)
          expected=$(echo "$examples" | wc -l)
          ran=0
          failed=""

          for path in $examples; do
            name=$(basename "$path" .rs)
            case "$path" in
              ./runner/*) crate="-p runner" ;;
              *)          crate="-p simdr" ;;
            esac

            echo "::group::$name"
            if timeout 240 cargo run $crate --release --example "$name"; then
              ran=$((ran + 1))
            else
              failed="$failed $name(exit $?)"
            fi
            echo "::endgroup::"
          done

          echo "$ran of $expected examples ran to a clean exit"
          if [ -n "$failed" ]; then
            echo "::error::these examples did not:$failed"
            exit 1
          fi
          if [ "$ran" -ne "$expected" ]; then
            echo "::error::$ran ran and the tree holds $expected"
            exit 1
          fi
