[package]
name = "simdr-cli"
version = "0.0.0"
edition = "2024"
description = "Ask a device what simdr needs to know about it before a module can be built."
license = "MIT OR Apache-2.0"
rust-version = "1.88"

# One path dependency and nothing from the registry. The emitter's `[dependencies]` stays empty;
# this reaches Vulkan through `runner`, which is where the FFI and the `unsafe` already live.
[dependencies]
runner = { path = "../runner" }

[[bin]]
name = "simdr"
path = "src/main.rs"
# The binary is `simdr` and so is the library, so `cargo doc --workspace` wrote both to
# `target/doc/simdr/index.html` and warned about the collision — one of them silently overwriting
# the other's front page. The library's is the one anybody reads; this crate's documentation is for
# whoever is editing it, and `src/main.rs` still carries it.
#
# The alternative was renaming the binary, and the binary's name is the command in every example in
# `README.md`. A doc page loses less.
doc = false
